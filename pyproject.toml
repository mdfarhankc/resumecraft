[project]
name = "resumecraft"
version = "0.6.0"
description = "Generate professional resumes from JSON with DOCX/PDF export, custom styling, and web framework support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mohammed Farhan K C", email = "kcfarhan123@gmail.com" }]
keywords = [
    "resume",
    "resume-builder",
    "resume-generator",
    "cv",
    "cv-builder",
    "cv-generator",
    "docx",
    "pdf",
    "json",
    "json-resume",
    "career",
    "cli",
    "python-docx",
    "pydantic",
    "template",
    "fastapi",
    "flask",
    "django",
    "word-document",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["python-docx>=1.2.0", "pydantic>=2.10.0", "typer>=0.15.0"]

[project.optional-dependencies]
pdf = ["docx2pdf>=0.1.8"]
watch = ["watchfiles>=1.0.0"]
yaml = ["pyyaml>=6.0"]
all = ["resumecraft[pdf,watch,yaml]"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocs-minify-plugin>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/mdfarhankc/resumecraft"
Documentation = "https://github.com/mdfarhankc/resumecraft#readme"
Repository = "https://github.com/mdfarhankc/resumecraft"
Issues = "https://github.com/mdfarhankc/resumecraft/issues"
Changelog = "https://github.com/mdfarhankc/resumecraft/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/mdfarhankc/resumecraft/releases"

[project.scripts]
resumecraft = "resumecraft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumecraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=resumecraft --cov-report=term-missing"

[tool.coverage.run]
source = ["src/resumecraft"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise ImportError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/resumecraft/cli.py" = ["B008"]  # typer requires call-in-default

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
